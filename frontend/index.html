<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gurbani Semantic Search</title>
  <style>
    :root {
      --bg-1: #f3ecd9;
      --bg-2: #d6e6f2;
      --ink: #1d2630;
      --muted: #5d6a78;
      --accent: #b2412e;
      --card: rgba(255, 255, 255, 0.78);
      --border: rgba(29, 38, 48, 0.14);
      --shadow: 0 16px 40px rgba(20, 35, 52, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 18%, rgba(178, 65, 46, 0.16), transparent 40%),
        radial-gradient(circle at 92% 10%, rgba(67, 114, 173, 0.18), transparent 42%),
        linear-gradient(130deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .shell {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 22px;
      backdrop-filter: blur(4px);
      overflow: hidden;
      animation: rise 480ms ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .header {
      padding: 24px 24px 14px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      margin: 0;
      font-size: clamp(1.35rem, 3.6vw, 2rem);
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .search {
      display: grid;
      gap: 12px;
      padding: 18px 24px 24px;
      grid-template-columns: 1fr auto auto auto;
      border-bottom: 1px solid var(--border);
    }

    .search input,
    .search select {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.98rem;
      background: #ffffff;
      color: var(--ink);
    }

    .search button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .search button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .search button:disabled {
      cursor: wait;
      filter: saturate(0.72);
      opacity: 0.82;
    }

    .search .ask-button {
      background: #294f73;
    }

    .answer-panel {
      display: none;
      margin: 20px 24px 0;
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(236, 245, 250, 0.55));
      box-shadow:
        0 18px 42px rgba(20, 35, 52, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      animation: answerIn 560ms cubic-bezier(.18, .82, .22, 1) both;
    }

    .answer-panel.visible {
      display: block;
    }

    @keyframes answerIn {
      from { opacity: 0; transform: translateY(18px) scale(.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .answer-label {
      margin: 0 0 9px;
      color: #294f73;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .answer-title {
      margin: 0 0 18px;
      font-size: clamp(1.18rem, 3vw, 1.55rem);
      line-height: 1.35;
    }

    .answer-statement {
      margin: 13px 0;
      color: #293746;
      font-size: 1rem;
      line-height: 1.65;
    }

    .citation-link {
      display: inline-grid;
      place-items: center;
      min-width: 1.55rem;
      height: 1.55rem;
      margin-left: 4px;
      border: 1px solid rgba(41, 79, 115, 0.25);
      border-radius: 999px;
      background: rgba(214, 230, 242, 0.72);
      color: #294f73;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      vertical-align: super;
    }

    .answer-caveat,
    .generation-status {
      margin: 17px 0 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(243, 236, 217, 0.62);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .follow-up {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 22px;
    }

    .follow-up input {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      font-size: 0.94rem;
    }

    .follow-up button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      background: #294f73;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .results {
      padding: 20px 24px 26px;
      display: grid;
      gap: 12px;
      overflow: hidden;
      transition: height 480ms cubic-bezier(.2, .8, .2, 1);
    }

    .results.refreshing .card {
      pointer-events: none;
      animation: resultAway 180ms ease both;
    }

    .empty {
      color: var(--muted);
      padding: 18px;
      border-radius: 14px;
      border: 1px dashed var(--border);
      background: rgba(255, 255, 255, 0.7);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      padding: 16px;
      animation: resultGrow 520ms cubic-bezier(.18, .82, .22, 1) both;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px) scale(1.008);
      box-shadow: 0 18px 34px rgba(20, 35, 52, 0.16);
      border-color: rgba(178, 65, 46, 0.35);
      outline: none;
    }

    .open-hint {
      display: inline-flex;
      margin-top: 12px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .feedback-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
    }

    .feedback-button {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.8);
      color: #344252;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .feedback-button:hover:not(:disabled),
    .feedback-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(41, 79, 115, 0.42);
      outline: none;
    }

    .feedback-button.selected {
      border-color: rgba(41, 79, 115, 0.4);
      background: rgba(214, 230, 242, 0.8);
      color: #294f73;
    }

    .feedback-button:disabled {
      cursor: default;
      opacity: 0.62;
    }

    .feedback-button.selected:disabled {
      opacity: 1;
    }

    .feedback-status {
      min-width: 7rem;
    }

    @keyframes resultGrow {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(.955);
        clip-path: inset(0 0 34% 0 round 16px);
      }
      68% {
        opacity: 1;
        transform: translateY(-2px) scale(1.006);
        clip-path: inset(0 0 0 0 round 16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        clip-path: inset(0 0 0 0 round 16px);
      }
    }

    @keyframes resultAway {
      to {
        opacity: 0;
        transform: translateY(-8px) scale(.98);
      }
    }

    .searching {
      position: relative;
      overflow: hidden;
    }

    .searching::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), transparent);
      animation: searchShimmer 1.05s ease-in-out infinite;
    }

    @keyframes searchShimmer {
      to { transform: translateX(100%); }
    }

    .gurmukhi {
      margin: 0;
      font-size: 1.22rem;
      line-height: 1.6;
      font-family: "Raavi", "Noto Sans Gurmukhi", sans-serif;
    }

    .line {
      margin: 7px 0 0;
      font-size: 0.94rem;
      color: #344252;
    }

    .meta {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .score {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .retrieval-status {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .focus-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: clamp(12px, 4vw, 44px);
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(243, 210, 178, 0.24), transparent 38%),
        radial-gradient(circle at 86% 78%, rgba(121, 164, 203, 0.24), transparent 42%),
        rgba(15, 28, 40, 0.24);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      backdrop-filter: blur(18px) saturate(125%);
    }

    .focus-overlay.open {
      display: grid;
      animation: veilIn 220ms ease both;
    }

    .focus-overlay::before,
    .focus-overlay::after {
      content: "";
      position: absolute;
      width: min(46vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(8px);
      opacity: 0.5;
    }

    .focus-overlay::before {
      top: -24%;
      right: -8%;
      background: radial-gradient(circle, rgba(255, 245, 223, 0.34), transparent 68%);
    }

    .focus-overlay::after {
      bottom: -30%;
      left: -10%;
      background: radial-gradient(circle, rgba(145, 190, 224, 0.3), transparent 68%);
    }

    .focus-panel {
      position: relative;
      z-index: 1;
      isolation: isolate;
      width: min(1040px, 100%);
      max-height: calc(100vh - 28px);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.66), rgba(247, 242, 230, 0.52)),
        radial-gradient(circle at top right, rgba(110, 161, 205, 0.18), transparent 38%);
      -webkit-backdrop-filter: blur(34px) saturate(145%) brightness(1.04);
      backdrop-filter: blur(34px) saturate(145%) brightness(1.04);
      box-shadow:
        0 34px 100px rgba(5, 14, 24, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        inset 0 -1px 0 rgba(84, 108, 130, 0.12);
      transform-origin: center;
    }

    .focus-panel::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(118deg, rgba(255, 255, 255, 0.38), transparent 22% 74%, rgba(255, 255, 255, 0.18)),
        radial-gradient(circle at 72% -18%, rgba(255, 255, 255, 0.62), transparent 32%);
      opacity: 0.75;
    }

    .focus-panel.animating {
      animation: cardFocus 520ms cubic-bezier(.18, .82, .22, 1) both;
    }

    @keyframes veilIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cardFocus {
      0% { opacity: 0; transform: perspective(1200px) rotateY(-16deg) translateY(40px) scale(.74); }
      62% { opacity: 1; transform: perspective(1200px) rotateY(2deg) translateY(-5px) scale(1.015); }
      100% { opacity: 1; transform: perspective(1200px) rotateY(0) translateY(0) scale(1); }
    }

    .focus-close {
      position: sticky;
      z-index: 2;
      top: 16px;
      float: right;
      margin: 16px 16px 0 0;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.48);
      -webkit-backdrop-filter: blur(16px) saturate(135%);
      backdrop-filter: blur(16px) saturate(135%);
      color: var(--ink);
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(20, 35, 52, 0.12);
    }

    .focus-content {
      padding: clamp(24px, 5vw, 54px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .focus-title {
      margin: 0;
      max-width: 880px;
      font-family: "Raavi", "Noto Sans Gurmukhi", sans-serif;
      font-size: clamp(1.45rem, 4vw, 2.35rem);
      line-height: 1.55;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 28px 0;
    }

    .context-box {
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.44), rgba(237, 230, 211, 0.3));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.76),
        0 8px 24px rgba(20, 35, 52, 0.06);
    }

    .context-box h3 {
      margin: 0 0 7px;
      font-size: 0.86rem;
      color: var(--accent);
    }

    .context-box p {
      margin: 0;
      color: #344252;
      line-height: 1.55;
    }

    .passage-heading {
      margin: 32px 0 6px;
      font-size: 1.08rem;
    }

    .passage-note {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .passage {
      display: grid;
      gap: 10px;
    }

    .passage-line {
      padding: 14px 16px;
      border-left: 3px solid transparent;
      border-radius: 4px 14px 14px 4px;
      background: rgba(232, 241, 247, 0.34);
    }

    .passage-line.selected {
      border-left-color: var(--accent);
      background: rgba(178, 65, 46, 0.08);
    }

    .passage-line .gurmukhi {
      font-size: 1.08rem;
    }

    .reader-launch,
    .reader-control {
      border: 1px solid rgba(41, 79, 115, 0.28);
      border-radius: 12px;
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.58);
      color: #294f73;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .reader-launch {
      margin-top: 18px;
      background: #294f73;
      color: white;
    }

    .reader-launch.upward {
      margin: 0 0 18px;
    }

    .reader-stream {
      display: grid;
      gap: 12px;
    }

    .reader-line {
      padding: 18px;
      border: 1px solid rgba(29, 38, 48, 0.1);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.36);
    }

    .reader-line.selected {
      border-color: rgba(178, 65, 46, 0.42);
      background: rgba(178, 65, 46, 0.08);
      box-shadow: 0 8px 28px rgba(178, 65, 46, 0.08);
    }

    .reader-ang-divider {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 4px;
      padding: 14px 2px 8px;
      border-bottom: 1px solid rgba(178, 65, 46, 0.28);
    }

    .reader-ang-divider strong {
      color: var(--accent);
      font-family: Georgia, serif;
      font-size: 1.2rem;
    }

    .reader-shabad-divider {
      margin: 14px 0 -2px;
      padding: 10px 13px;
      border-radius: 11px;
      background: rgba(41, 79, 115, 0.08);
      color: #294f73;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .reader-citation {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .reader-load {
      display: grid;
      place-items: center;
      min-height: 46px;
    }

    body.modal-open {
      overflow: hidden;
    }

    @media (max-width: 720px) {
      .search {
        grid-template-columns: 1fr;
      }

      .search button {
        height: 44px;
      }

      .follow-up {
        grid-template-columns: 1fr;
      }

      .follow-up button {
        height: 42px;
      }

      .context-grid {
        grid-template-columns: 1fr;
      }

      .focus-content {
        padding-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }

    @media (prefers-contrast: more) {
      .focus-overlay {
        background: rgba(14, 23, 33, 0.64);
      }

      .focus-panel {
        background: #fffdf8;
      }

      .context-box {
        background: #f7f1e4;
        border-color: rgba(29, 38, 48, 0.32);
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <h1 class="title">Gurbani Semantic Search</h1>
      <p class="subtitle">Search common English concepts, Roman Punjabi terms, or Gurmukhi. Every result includes an Ang citation.</p>
    </header>

    <form class="search" id="searchForm">
      <input id="queryInput" placeholder="Ask: How can I overcome ego?" required />
      <select id="topK">
        <option value="3">Top 3</option>
        <option value="5" selected>Top 5</option>
        <option value="10">Top 10</option>
      </select>
      <button type="submit">Search sources</button>
      <button type="button" class="ask-button" id="askButton">Ask Gurbani</button>
    </form>

    <section class="answer-panel" id="answerPanel" aria-live="polite"></section>

    <section class="results" id="results">
      <div class="empty">Run your first query to view verses with citations.</div>
    </section>
  </main>

  <div class="focus-overlay" id="focusOverlay" role="dialog" aria-modal="true" aria-labelledby="focusTitle">
    <section class="focus-panel" id="focusPanel">
      <button class="focus-close" id="focusClose" aria-label="Close passage">×</button>
      <div class="focus-content" id="focusContent"></div>
    </section>
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("queryInput");
    const topK = document.getElementById("topK");
    const resultsEl = document.getElementById("results");
    const searchButton = form.querySelector('button[type="submit"]');
    const askButton = document.getElementById("askButton");
    const answerPanel = document.getElementById("answerPanel");
    const focusOverlay = document.getElementById("focusOverlay");
    const focusPanel = document.getElementById("focusPanel");
    const focusContent = document.getElementById("focusContent");
    const focusClose = document.getElementById("focusClose");
    let passageReturnFocus = null;
    let passageReturnScrollY = 0;
    let previousQuestions = [];
    let currentQuery = "";
    let readerSelectedId = null;
    let readerEarlierLines = [];
    let readerHasLater = false;
    let readerLaterLines = [];
    let readerHasEarlier = false;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function score(value) {
      return typeof value === "number" ? value.toFixed(3) : "n/a";
    }

    function renderResults(payload) {
      if (!payload.results || payload.results.length === 0) {
        resultsEl.innerHTML = '<div class="empty">No results found for this query.</div>';
        return;
      }

      const retrievalMode = payload.retrieval_mode || (
        payload.results.some((item) => typeof item.dense_score === "number")
          ? "hybrid"
          : "keyword"
      );
      resultsEl.innerHTML = `<p class="retrieval-status">${escapeHtml(retrievalMode)} retrieval</p>` + payload.results.map((item, idx) => `
        <article class="card" tabindex="0" role="button" data-verse-id="${escapeHtml(item.verse_id)}"
          data-source-id="${escapeHtml(item.citation.source_id)}"
          data-result-rank="${idx + 1}"
          data-sparse-score="${item.sparse_score ?? ""}"
          data-dense-score="${item.dense_score ?? ""}"
          data-fusion-score="${item.fusion_score ?? ""}"
          aria-label="Open full passage for Ang ${item.citation.ang}" style="animation-delay:${idx * 70}ms">
          <p class="gurmukhi">${escapeHtml(item.gurmukhi)}</p>
          ${item.transliteration ? `<p class="line"><strong>Transliteration:</strong> ${escapeHtml(item.transliteration)}</p>` : ""}
          ${
            Array.isArray(item.translations) && item.translations.length
              ? item.translations.map((t) =>
                  `<p class="line"><strong>Translation (${escapeHtml(t.lang)}${t.translator ? `, ${escapeHtml(t.translator)}` : ""}):</strong> ${escapeHtml(t.text)}</p>`
                ).join("")
              : (item.translation ? `<p class="line"><strong>Translation:</strong> ${escapeHtml(item.translation)}</p>` : "")
          }
          <p class="line"><strong>Why matched:</strong> ${escapeHtml(item.match_explanation)}</p>
          <div class="meta">
            <span><strong>Ang:</strong> ${item.citation.ang}</span>
            <span><strong>Raag:</strong> ${escapeHtml(item.citation.raag || "n/a")}</span>
            <span><strong>Author:</strong> ${escapeHtml(item.citation.author || "n/a")}</span>
          </div>
          <div class="score">
            sparse=${score(item.sparse_score)} | dense=${score(item.dense_score)} | fusion=${score(item.fusion_score)}
          </div>
          <div class="feedback-row" aria-label="Rate this search result">
            <span>Was this relevant?</span>
            <button class="feedback-button" type="button" data-helpful="true">Helpful</button>
            <button class="feedback-button" type="button" data-helpful="false">Not relevant</button>
            <span class="feedback-status" aria-live="polite"></span>
          </div>
          <span class="open-hint">Explore full passage →</span>
        </article>
      `).join("");
    }

    function renderAnswer(payload) {
      const sourceNumbers = new Map(
        payload.sources.map((source, index) => [source.citation.source_id, index + 1])
      );
      const statements = (payload.answer.statements || []).map((statement) => {
        const citations = statement.citation_ids
          .map((sourceId) => sourceNumbers.has(sourceId)
            ? `<button class="citation-link" type="button" data-source-id="${escapeHtml(sourceId)}"
                aria-label="Open source ${sourceNumbers.get(sourceId)}">${sourceNumbers.get(sourceId)}</button>`
            : "")
          .join("");
        return `<p class="answer-statement">${escapeHtml(statement.text)} ${citations}</p>`;
      }).join("");
      const summaryCitations = (payload.answer.summary_citation_ids || [])
        .map((sourceId) => sourceNumbers.has(sourceId)
          ? `<button class="citation-link" type="button" data-source-id="${escapeHtml(sourceId)}"
              aria-label="Open source ${sourceNumbers.get(sourceId)}">${sourceNumbers.get(sourceId)}</button>`
          : "")
        .join("");

      const status = payload.generated
        ? `<p class="generation-status">Grounded with ${payload.sources.length} retrieved passages · ${escapeHtml(payload.retrieval_mode || "keyword")} retrieval · ${escapeHtml(payload.model || "AI model")}</p>`
        : `<p class="generation-status"><strong>AI explanation unavailable.</strong> ${escapeHtml(payload.generation_error || "Generation is not configured.")} The source passages below are still real retrieval results.</p>`;

      answerPanel.innerHTML = `
        <p class="answer-label">Grounded response</p>
        <h2 class="answer-title">${escapeHtml(payload.answer.summary)} ${summaryCitations}</h2>
        ${statements}
        ${payload.answer.caveat ? `<p class="answer-caveat">${escapeHtml(payload.answer.caveat)}</p>` : ""}
        ${status}
        <form class="follow-up" id="followUpForm">
          <input id="followUpInput" placeholder="Ask a follow-up about these teachings…" required />
          <button type="submit">Ask follow-up</button>
        </form>
      `;
      answerPanel.classList.add("visible");
    }

    function resizeResults(render) {
      const startHeight = resultsEl.getBoundingClientRect().height;
      resultsEl.style.height = `${startHeight}px`;
      render();
      const targetHeight = resultsEl.scrollHeight;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          resultsEl.style.height = `${targetHeight}px`;
        });
      });
    }

    resultsEl.addEventListener("transitionend", (event) => {
      if (event.propertyName === "height") {
        resultsEl.style.height = "auto";
      }
    });

    const lineTypeNotes = {
      Manglacharan: "An invocation or opening expression that establishes the sacred orientation of the composition.",
      Sirlekh: "A heading that identifies the composition, musical setting, or authorship that follows.",
      Rahao: "The pause or refrain line. It commonly acts as a thematic anchor for reading the surrounding Shabad.",
      Pankti: "A standard poetic line within the Shabad's unfolding verse structure."
    };

    async function openPassage(card, returnFocus = card) {
      const verseId = card.dataset.verseId;
      if (!verseId) return;
      passageReturnFocus = returnFocus;
      passageReturnScrollY = window.scrollY;
      focusContent.innerHTML = '<div class="empty">Opening the full Shabad…</div>';
      focusPanel.classList.remove("animating");
      focusOverlay.classList.add("open");
      // Force a fresh animation timeline even though the same modal element is reused.
      void focusPanel.offsetWidth;
      focusPanel.classList.add("animating");
      document.body.classList.add("modal-open");
      focusClose.focus();

      try {
        const response = await fetch(`/passage/${encodeURIComponent(verseId)}`);
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        const payload = await response.json();
        const selected = payload.lines.find((line) => line.verse_id === verseId) || payload.lines[0];
        const context = selected.context || {};
        const lineType = context.line_type || "Pankti";
        const passageLines = payload.lines.map((line) => `
          <div class="passage-line ${line.verse_id === verseId ? "selected" : ""}">
            <p class="gurmukhi">${escapeHtml(line.gurmukhi)}</p>
            ${line.transliteration ? `<p class="line">${escapeHtml(line.transliteration)}</p>` : ""}
            ${line.translation ? `<p class="line">${escapeHtml(line.translation)}</p>` : ""}
          </div>
        `).join("");

        focusContent.innerHTML = `
          <p class="eyebrow">Ang ${selected.citation.ang} · ${escapeHtml(selected.citation.raag || "Sri Guru Granth Sahib Ji")}</p>
          <h2 class="focus-title" id="focusTitle">${escapeHtml(selected.gurmukhi)}</h2>
          ${selected.transliteration ? `<p class="line"><strong>Transliteration:</strong> ${escapeHtml(selected.transliteration)}</p>` : ""}
          ${selected.translation ? `<p class="line"><strong>Translation:</strong> ${escapeHtml(selected.translation)}</p>` : ""}
          <div class="context-grid">
            <div class="context-box">
              <h3>Setting and voice</h3>
              <p><strong>${escapeHtml(selected.citation.author || "Unknown writer")}</strong> · ${escapeHtml(selected.citation.raag || "Section unavailable")}. ${escapeHtml(context.section_description || "No additional section note is available in the source dataset.")}</p>
            </div>
            <div class="context-box">
              <h3>Poetic role: ${escapeHtml(lineType)}</h3>
              <p>${escapeHtml(lineTypeNotes[lineType] || "This label describes the line's structural role in the source text.")}</p>
            </div>
          </div>
          <h3 class="passage-heading">The complete Shabad</h3>
          <p class="passage-note">The selected line is highlighted. Translations are by Dr. Sant Singh Khalsa via Shabad OS 4.8.7.</p>
          <button class="reader-launch upward" type="button" data-reader-action="open-earlier"
            data-anchor-id="${escapeHtml(payload.lines[0].verse_id)}">← Continue reading upward</button>
          <div class="passage">${passageLines}</div>
          <button class="reader-launch" type="button" data-reader-action="open"
            data-verse-id="${escapeHtml(verseId)}"
            data-anchor-id="${escapeHtml(payload.lines[payload.lines.length - 1].verse_id)}">Continue reading downward →</button>
        `;
      } catch (error) {
        focusContent.innerHTML = `<div class="empty">Could not open passage: ${escapeHtml(error.message)}</div>`;
      }
    }

    function readerLineHtml(line) {
      return `
        <article class="reader-line ${line.verse_id === readerSelectedId ? "selected" : ""}" data-reader-verse-id="${escapeHtml(line.verse_id)}">
          <p class="reader-citation">Ang ${line.citation.ang} · ${escapeHtml(line.citation.raag || "Sri Guru Granth Sahib Ji")} · ${escapeHtml(line.citation.author || "Unknown writer")}</p>
          <p class="gurmukhi">${escapeHtml(line.gurmukhi)}</p>
          ${line.transliteration ? `<p class="line">${escapeHtml(line.transliteration)}</p>` : ""}
          ${line.translation ? `<p class="line">${escapeHtml(line.translation)}</p>` : ""}
        </article>`;
    }

    function renderReaderStream(streamId, loadedLines) {
      let previousAng = null;
      let previousShabad = null;
      const html = loadedLines.map((line) => {
        const shabadId = line.context?.shabad_id || line.verse_id;
        const angChanged = line.citation.ang !== previousAng;
        const shabadChanged = shabadId !== previousShabad;
        let heading = "";
        if (angChanged) {
          heading += `<header class="reader-ang-divider"><strong>Ang ${line.citation.ang}</strong><span>${escapeHtml(line.citation.raag || "Sri Guru Granth Sahib Ji")}</span></header>`;
        }
        if (shabadChanged) {
          heading += `<div class="reader-shabad-divider">New Shabad · ${escapeHtml(line.citation.author || "Writer unavailable")} · ${escapeHtml(line.citation.raag || "Section unavailable")}</div>`;
        }
        previousAng = line.citation.ang;
        previousShabad = shabadId;
        return heading + readerLineHtml(line);
      }).join("");
      document.getElementById(streamId).innerHTML = html;
    }

    function updateLaterControl() {
      const later = document.getElementById("readerLater");
      if (later) later.innerHTML = readerHasLater
        ? '<button class="reader-control" type="button" data-reader-action="later">Load later lines</button>'
        : '<span class="passage-note">End of Sri Guru Granth Sahib Ji</span>';
    }

    function updateEarlierControl() {
      const earlier = document.getElementById("readerEarlier");
      if (earlier) earlier.innerHTML = readerHasEarlier
        ? '<button class="reader-control" type="button" data-reader-action="earlier">Load earlier lines</button>'
        : '<span class="passage-note">Beginning of Sri Guru Granth Sahib Ji</span>';
    }

    async function openContinuousReader(verseId, anchorId, button) {
      readerSelectedId = verseId;
      readerLaterLines = [];
      button.insertAdjacentHTML("afterend", `
        <section class="continuous-reader" id="continuousReader">
        <h3 class="passage-heading">Continuing in canonical order</h3>
        <p class="passage-note">Ang and Shabad boundaries remain visible as you continue downward.</p>
        <div class="reader-stream" id="readerLaterStream"></div>
        <div class="reader-load" id="readerLater"><span class="passage-note">Loading later lines…</span></div>
        </section>`);
      button.remove();
      try {
        const response = await fetch(`/reader/${encodeURIComponent(anchorId)}?before=0&after=30`);
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        const payload = await response.json();
        readerHasLater = payload.has_more_after;
        readerLaterLines = payload.lines.filter((line) => line.verse_id !== anchorId);
        renderReaderStream("readerLaterStream", readerLaterLines);
        updateLaterControl();
      } catch (error) {
        document.getElementById("continuousReader").innerHTML = `<div class="empty">Could not load later lines: ${escapeHtml(error.message)}</div>`;
      }
    }

    async function openEarlierReader(anchorId, button) {
      readerEarlierLines = [];
      const heightBeforeShell = focusPanel.scrollHeight;
      button.insertAdjacentHTML("beforebegin", `
        <section class="continuous-reader" id="earlierReader">
          <div class="reader-load" id="readerEarlier"><span class="passage-note">Loading earlier lines…</span></div>
          <div class="reader-stream" id="readerEarlierStream"></div>
          <h3 class="passage-heading">Earlier in canonical order</h3>
          <p class="passage-note">The complete Shabad continues below.</p>
        </section>`);
      button.remove();
      focusPanel.scrollTop += focusPanel.scrollHeight - heightBeforeShell;
      try {
        const response = await fetch(`/reader/${encodeURIComponent(anchorId)}?before=30&after=0`);
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        const payload = await response.json();
        const heightBeforeLines = focusPanel.scrollHeight;
        readerEarlierLines = payload.lines.filter((line) => line.verse_id !== anchorId);
        readerHasEarlier = payload.has_more_before;
        renderReaderStream("readerEarlierStream", readerEarlierLines);
        updateEarlierControl();
        focusPanel.scrollTop += focusPanel.scrollHeight - heightBeforeLines;
      } catch (error) {
        document.getElementById("earlierReader").innerHTML = `<div class="empty">Could not load earlier lines: ${escapeHtml(error.message)}</div>`;
      }
    }

    async function extendLaterReader(button) {
      if (!readerLaterLines.length) return;
      const anchor = readerLaterLines[readerLaterLines.length - 1].verse_id;
      button.disabled = true;
      button.textContent = "Loading…";
      try {
        const response = await fetch(`/reader/${encodeURIComponent(anchor)}?before=0&after=30`);
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        const payload = await response.json();
        const newLines = payload.lines.filter((line) => line.verse_id !== anchor);
        readerLaterLines = [...readerLaterLines, ...newLines];
        renderReaderStream("readerLaterStream", readerLaterLines);
        readerHasLater = payload.has_more_after;
        updateLaterControl();
      } catch (error) {
        button.disabled = false;
        button.textContent = "Retry later lines";
      }
    }

    async function extendEarlierReader(button) {
      if (!readerEarlierLines.length) return;
      const anchor = readerEarlierLines[0].verse_id;
      button.disabled = true;
      button.textContent = "Loading…";
      try {
        const response = await fetch(`/reader/${encodeURIComponent(anchor)}?before=30&after=0`);
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        const payload = await response.json();
        const newLines = payload.lines.filter((line) => line.verse_id !== anchor);
        const oldHeight = focusPanel.scrollHeight;
        readerEarlierLines = [...newLines, ...readerEarlierLines];
        renderReaderStream("readerEarlierStream", readerEarlierLines);
        readerHasEarlier = payload.has_more_before;
        updateEarlierControl();
        focusPanel.scrollTop += focusPanel.scrollHeight - oldHeight;
      } catch (error) {
        button.disabled = false;
        button.textContent = "Retry earlier lines";
      }
    }

    focusContent.addEventListener("click", (event) => {
      const button = event.target.closest("[data-reader-action]");
      if (!button) return;
      const action = button.dataset.readerAction;
      if (action === "open") {
        openContinuousReader(
          button.dataset.verseId,
          button.dataset.anchorId,
          button
        );
      }
      if (action === "open-earlier") {
        openEarlierReader(button.dataset.anchorId, button);
      }
      if (action === "later") extendLaterReader(button);
      if (action === "earlier") extendEarlierReader(button);
    });

    function closePassage() {
      focusOverlay.classList.remove("open");
      focusPanel.classList.remove("animating");
      document.body.classList.remove("modal-open");
      focusContent.innerHTML = "";
      const returnFocus = passageReturnFocus;
      const returnScrollY = passageReturnScrollY;
      passageReturnFocus = null;
      requestAnimationFrame(() => {
        if (returnFocus?.isConnected) {
          returnFocus.focus({ preventScroll: true });
        }
        window.scrollTo({ top: returnScrollY, behavior: "auto" });
      });
    }

    async function submitFeedback(button) {
      const card = button.closest(".card");
      if (!card || !currentQuery) return;
      const buttons = [...card.querySelectorAll(".feedback-button")];
      const status = card.querySelector(".feedback-status");
      buttons.forEach((item) => { item.disabled = true; });
      status.textContent = "Saving…";
      const optionalNumber = (value) => value === "" ? null : Number(value);
      try {
        const response = await fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: currentQuery,
            verse_id: card.dataset.verseId,
            source_id: card.dataset.sourceId,
            result_rank: Number(card.dataset.resultRank),
            helpful: button.dataset.helpful === "true",
            sparse_score: optionalNumber(card.dataset.sparseScore),
            dense_score: optionalNumber(card.dataset.denseScore),
            fusion_score: optionalNumber(card.dataset.fusionScore)
          })
        });
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        button.classList.add("selected");
        status.textContent = "Thanks—saved locally.";
      } catch (error) {
        buttons.forEach((item) => { item.disabled = false; });
        status.textContent = "Could not save.";
      }
    }

    resultsEl.addEventListener("click", (event) => {
      const feedbackButton = event.target.closest(".feedback-button");
      if (feedbackButton) {
        event.stopPropagation();
        submitFeedback(feedbackButton);
        return;
      }
      const card = event.target.closest(".card");
      if (card) openPassage(card);
    });

    resultsEl.addEventListener("keydown", (event) => {
      const card = event.target.closest(".card");
      if (card && event.target === card && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openPassage(card);
      }
    });

    focusClose.addEventListener("click", closePassage);
    focusOverlay.addEventListener("click", (event) => {
      if (event.target === focusOverlay) closePassage();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && focusOverlay.classList.contains("open")) closePassage();
    });

    answerPanel.addEventListener("click", (event) => {
      const citation = event.target.closest(".citation-link");
      if (!citation) return;
      const card = resultsEl.querySelector(
        `.card[data-source-id="${CSS.escape(citation.dataset.sourceId)}"]`
      );
      if (card) openPassage(card, citation);
    });

    answerPanel.addEventListener("submit", (event) => {
      if (event.target.id !== "followUpForm") return;
      event.preventDefault();
      const input = document.getElementById("followUpInput");
      const question = input.value.trim();
      if (question) performAsk(question);
    });

    async function performAsk(question) {
      currentQuery = question;
      askButton.disabled = true;
      searchButton.disabled = true;
      askButton.textContent = "Grounding…";
      answerPanel.classList.add("visible");
      answerPanel.innerHTML = '<div class="empty searching">Retrieving passages, then composing a cited response…</div>';
      resizeResults(() => {
        resultsEl.innerHTML = '<div class="empty searching">Searching the Sri Guru Granth Sahib…</div>';
      });
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            top_k: Math.max(5, Number(topK.value)),
            previous_questions: previousQuestions
          })
        });
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        const payload = await response.json();
        previousQuestions = [...previousQuestions, question].slice(-6);
        queryInput.value = question;
        renderAnswer(payload);
        resizeResults(() => renderResults({
          results: payload.sources,
          retrieval_mode: payload.retrieval_mode
        }));
      } catch (error) {
        answerPanel.innerHTML = `<div class="empty">Could not generate an answer: ${escapeHtml(error.message)}</div>`;
      } finally {
        askButton.disabled = false;
        searchButton.disabled = false;
        askButton.textContent = "Ask Gurbani";
      }
    }

    askButton.addEventListener("click", () => {
      const question = queryInput.value.trim();
      if (question) performAsk(question);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = queryInput.value.trim();
      if (!query) return;

      currentQuery = query;
      previousQuestions = [];
      answerPanel.classList.remove("visible");
      answerPanel.innerHTML = "";
      searchButton.disabled = true;
      searchButton.textContent = "Searching…";
      resultsEl.classList.add("refreshing");
      await new Promise((resolve) => setTimeout(resolve, 180));
      resultsEl.classList.remove("refreshing");
      resizeResults(() => {
        resultsEl.innerHTML = '<div class="empty searching">Searching the Sri Guru Granth Sahib…</div>';
      });

      try {
        const response = await fetch("/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            top_k: Number(topK.value)
          })
        });

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const payload = await response.json();
        resizeResults(() => renderResults(payload));
      } catch (error) {
        resizeResults(() => {
          resultsEl.innerHTML = `<div class="empty">Search failed: ${escapeHtml(error.message)}</div>`;
        });
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = "Search sources";
      }
    });
  </script>
</body>
</html>
